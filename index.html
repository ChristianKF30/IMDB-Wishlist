<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="description" content="IMDb ønskeliste – legg til filmer og serier du vil se.">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>IMDb Ønskeliste</title>

    <!-- Google Fonts for sleek mobile typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="/img/favicon-imdb.svg">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-bottom: env(safe-area-inset-bottom, 1.5rem);
        }

        .hidden {
            display: none !important;
        }

        /* Ensure form inputs are at least 16px to prevent iOS auto-zoom on focus */
        input,
        textarea,
        select {
            font-size: 16px !important;
        }

        .submit-button {
            background-color: #facc15;
            color: #111827;
            border: none;
            border-radius: 0.5rem;
            padding: 0.625rem 1.5rem;
            min-height: 48px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .submit-button:hover {
            background-color: #eab308;
        }

        .submit-button:active {
            transform: scale(0.98);
        }

        .comment-form-container {
            margin-bottom: 1.5rem;
        }

        .comment-form-input {
            width: 100%;
            background-color: #374151;
            color: #ffffff;
            border-radius: 0.5rem;
            border: 1px solid #4b5563;
            outline: none;
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        .comment-form-input:focus {
            border-color: #facc15;
            box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.2);
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen selection:bg-yellow-500 selection:text-black">

    <div class="container mx-auto max-w-2xl px-4 py-6 sm:py-10">
        <!-- Header -->
        <header class="text-center mb-8 sm:mb-10 pt-2 sm:pt-4">
            <div class="inline-flex items-center justify-center gap-2 mb-2">
                <span
                    class="bg-yellow-500 text-gray-900 font-extrabold text-xs px-2 py-0.5 rounded tracking-wider uppercase">IMDb</span>
                <span class="text-xs font-semibold text-gray-400 tracking-wide uppercase">Watchlist</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-yellow-400 tracking-tight">Film & Serie Ønskeliste</h1>
            <p class="text-sm sm:text-base text-gray-400 mt-2 px-2">Lim inn IMDb-lenker på det du vil se!</p>
        </header>

        <!-- Legg til skjema -->
        <div
            class="bg-gray-800/90 backdrop-blur border border-gray-700/60 p-4 sm:p-6 rounded-xl sm:rounded-2xl shadow-xl mb-8">
            <!-- Meldinger for suksess og feil -->
            <div id="errorMessage"
                class="hidden bg-red-900/60 border border-red-500/40 text-red-200 px-4 py-3 rounded-lg mb-4 text-center text-sm font-semibold shadow-inner">
            </div>
            <div id="successMessage"
                class="hidden bg-green-900/60 border border-green-500/40 text-green-200 px-4 py-3 rounded-lg mb-4 text-center text-sm font-semibold shadow-inner">
            </div>

            <form id="wishForm" class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <input type="url" id="imdbUrl" placeholder="https://www.imdb.com/title/tt..." required
                        pattern="https?://(www\.)?imdb\.com/title/tt\d+.*"
                        title="Skriv inn en IMDb-tittellink (f.eks. https://www.imdb.com/title/tt11198330/)"
                        class="w-full min-h-[48px] bg-gray-700/80 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-400 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/20 transition-all">
                </div>
                <button type="submit" class="submit-button w-full sm:w-auto shadow-md">
                    <svg class="w-5 h-5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4">
                        </path>
                    </svg>
                    Legg til
                </button>
            </form>
        </div>

        <!-- Ønsker Tittel -->
        <div class="flex items-center justify-between mt-8 mb-4 px-1">
            <h2 class="text-xl sm:text-2xl font-bold text-yellow-400">Ønsker</h2>
            <span id="wishCountBadge"
                class="text-xs text-gray-400 bg-gray-800 px-2.5 py-1 rounded-full border border-gray-700">0 lagt
                til</span>
        </div>

        <!-- Ønsker Liste -->
        <div
            class="bg-gray-800/90 backdrop-blur border border-gray-700/60 p-4 sm:p-6 rounded-xl sm:rounded-2xl shadow-xl mb-10">
            <p id="emptyMessage" class="text-gray-500 py-6 text-center text-sm sm:text-base">Ønskelisten er tom. Legg
                til noe over!</p>
            <ul id="wishList" class="divide-y divide-gray-700/60"></ul>
        </div>

        <!-- Kommentarer Tittel -->
        <div class="flex items-center justify-between mt-8 mb-4 px-1">
            <h2 class="text-xl sm:text-2xl font-bold text-yellow-400">Kommentarer</h2>
        </div>

        <!-- Kommentar Skjema -->
        <div
            class="bg-gray-800/90 backdrop-blur border border-gray-700/60 p-4 sm:p-6 rounded-xl sm:rounded-2xl shadow-xl mb-6">
            <form id="commentForm" class="comment-form-container mb-0">
                <input type="text" id="commentName" placeholder="Ditt navn..." required
                    class="comment-form-input min-h-[44px] p-3 mb-3">
                <textarea id="commentInput" required class="comment-form-input p-3 mb-3 leading-normal"
                    placeholder="Skriv en kommentar..." rows="3"></textarea>
                <div class="comment-submit-wrapper">
                    <button type="submit" class="submit-button w-full sm:w-auto shadow-md">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                        Send kommentar
                    </button>
                </div>
            </form>
        </div>

        <!-- Kommentarer Liste -->
        <div id="commentsContainer" class="space-y-3 sm:space-y-4"></div>
    </div>

    <script>
        const RENDER_API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:3000'
            : 'https://imdb-wishlist-qmjq.onrender.com';
        const wishForm = document.getElementById('wishForm');
        const imdbUrlInput = document.getElementById('imdbUrl');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const emptyMessage = document.getElementById('emptyMessage');
        const wishList = document.getElementById('wishList');
        const wishCountBadge = document.getElementById('wishCountBadge');
        const submitButton = wishForm.querySelector('button[type="submit"]');
        let successTimeoutId = null;
        let errorTimeoutId = null;

        // Kommentarer-elementer
        const commentForm = document.getElementById('commentForm');
        const commentInput = document.getElementById('commentInput');
        const commentName = document.getElementById('commentName');
        const commentsContainer = document.getElementById('commentsContainer');

        function isValidImdbLink(value) {
            if (!value) return false;
            try {
                const normalized = value.trim().startsWith('http://') || value.trim().startsWith('https://')
                    ? value.trim()
                    : `https://${value.trim()}`;
                const parsed = new URL(normalized);
                const hostname = parsed.hostname.toLowerCase();
                if (hostname !== 'imdb.com' && !hostname.endsWith('.imdb.com')) {
                    return false;
                }
                return /\/title\/tt\d+/i.test(parsed.pathname);
            } catch {
                return false;
            }
        }

        function renderWishes(wishes) {
            wishList.innerHTML = '';
            if (!wishes || wishes.length === 0) {
                emptyMessage.style.display = 'block';
                if (wishCountBadge) wishCountBadge.textContent = '0 lagt til';
                return;
            }
            emptyMessage.style.display = 'none';
            if (wishCountBadge) wishCountBadge.textContent = `${wishes.length} ${wishes.length === 1 ? 'lagt til' : 'lagt til'}`;

            wishes.forEach(wish => {
                const li = document.createElement('li');
                li.className = 'py-3.5 sm:py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 sm:gap-3 transition-colors';
                const url = wish.imdb_url || wish.url || '';
                const title = wish.title || url;

                const contentWrapper = document.createElement('div');
                contentWrapper.className = 'flex-1 min-w-0 pr-1';

                const titleRow = document.createElement('div');
                titleRow.className = 'flex flex-wrap items-baseline gap-x-2 gap-y-1';

                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.className = 'text-yellow-400 hover:text-yellow-300 font-semibold text-sm sm:text-base leading-snug break-words underline-offset-2 hover:underline';
                link.textContent = title;
                titleRow.appendChild(link);

                // Badges container
                const badgesDiv = document.createElement('div');
                badgesDiv.className = 'inline-flex items-center gap-1.5 align-middle';

                if (wish.imdb_rating && wish.imdb_rating !== 'N/A') {
                    const ratingBadge = document.createElement('span');
                    ratingBadge.className = 'text-[11px] sm:text-xs text-yellow-400 font-bold bg-yellow-500/10 px-1.5 py-0.5 rounded border border-yellow-500/30 shrink-0';
                    ratingBadge.textContent = '★ ' + wish.imdb_rating;
                    badgesDiv.appendChild(ratingBadge);
                }

                if (wish.type) {
                    const typeBadge = document.createElement('span');
                    typeBadge.className = 'text-[11px] sm:text-xs text-gray-300 font-medium bg-gray-700/70 px-1.5 py-0.5 rounded border border-gray-600/50 shrink-0';
                    typeBadge.textContent = wish.type;
                    badgesDiv.appendChild(typeBadge);
                }

                titleRow.appendChild(badgesDiv);
                contentWrapper.appendChild(titleRow);
                li.appendChild(contentWrapper);

                const actionsWrapper = document.createElement('div');
                actionsWrapper.className = 'flex items-center justify-end sm:justify-center shrink-0 self-end sm:self-center';

                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'bg-red-600/90 hover:bg-red-600 active:bg-red-700 active:scale-95 text-white text-xs font-semibold px-3 py-1.5 rounded-md transition-all shadow-sm';
                deleteButton.textContent = 'Slett';
                deleteButton.addEventListener('click', () => deleteWish(wish.id || '', deleteButton));

                actionsWrapper.appendChild(deleteButton);
                li.appendChild(actionsWrapper);
                wishList.appendChild(li);
            });
        }

        async function deleteWish(id, btn) {
            if (!id) return;
            try {
                const url = new URL(`/wishes/${id}`, RENDER_API_URL).href;
                const res = await fetch(url, { method: 'DELETE' });
                if (res.ok) {
                    btn.closest('li').remove();
                    const remaining = wishList.querySelectorAll('li').length;
                    if (wishCountBadge) wishCountBadge.textContent = `${remaining} lagt til`;
                    if (remaining === 0) {
                        emptyMessage.style.display = 'block';
                    }
                }
            } catch (err) {
                console.error('Kunne ikke slette ønske:', err);
            }
        }

        async function deleteComment(id, btn) {
            if (!id) return;
            try {
                const url = new URL(`/comments/${id}`, RENDER_API_URL).href;
                const res = await fetch(url, { method: 'DELETE' });
                if (res.ok) {
                    btn.closest('.comment-card').remove();
                    if (commentsContainer.children.length === 0) {
                        commentsContainer.innerHTML = '<p class="text-gray-500 text-center py-6 text-sm sm:text-base">Ingen kommentarer ennå. Bli den første!</p>';
                    }
                }
            } catch (err) {
                console.error('Kunne ikke slette kommentar:', err);
            }
        }

        async function fetchWishes() {
            try {
                const url = new URL('/wishes', RENDER_API_URL).href;
                const res = await fetch(url);
                if (!res.ok) throw new Error('Kunne ikke hente ønskelisten.');
                const wishes = await res.json();
                renderWishes(wishes);
            } catch (err) {
                showError('Feil ved tilkobling til serveren.');
            }
        }

        wishForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.add('hidden');

            const urlValue = imdbUrlInput.value.trim();
            if (!isValidImdbLink(urlValue)) {
                showError('Skriv inn en gyldig IMDb-tittellink (f.eks. https://www.imdb.com/title/tt1234567).');
                return;
            }

            submitButton.disabled = true;
            submitButton.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const url = new URL('/wishes', RENDER_API_URL).href;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlValue })
                });

                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({ error: `Serverfeil (${res.status})` }));
                    throw new Error(errorData.error || 'Noe gikk galt.');
                }

                imdbUrlInput.value = '';
                await fetchWishes();
                showSuccess('Ønsket er lagt til!');
            } catch (err) {
                showError(err.message);
            } finally {
                submitButton.disabled = false;
                submitButton.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        function fadeElement(element, duration = 300) {
            element.style.transition = `opacity ${duration}ms ease`;
            element.style.opacity = '0';
            return new Promise(resolve => {
                setTimeout(() => {
                    element.classList.add('hidden');
                    element.style.display = '';
                    element.style.transition = '';
                    element.style.opacity = '';
                    resolve();
                }, duration);
            });
        }

        function showError(msg) {
            if (successTimeoutId) {
                clearTimeout(successTimeoutId);
                successTimeoutId = null;
            }
            if (errorTimeoutId) {
                clearTimeout(errorTimeoutId);
                errorTimeoutId = null;
            }

            successMessage.classList.add('hidden');
            errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden');
            errorMessage.style.display = 'block';
            errorMessage.style.opacity = '1';
            errorMessage.style.transition = 'opacity 0.3s ease';

            errorTimeoutId = setTimeout(() => {
                fadeElement(errorMessage).then(() => {
                    errorTimeoutId = null;
                });
            }, 4000);
        }

        function showSuccess(msg) {
            if (successTimeoutId) {
                clearTimeout(successTimeoutId);
                successTimeoutId = null;
            }
            if (errorTimeoutId) {
                clearTimeout(errorTimeoutId);
                errorTimeoutId = null;
            }

            errorMessage.classList.add('hidden');
            successMessage.textContent = msg;
            successMessage.classList.remove('hidden');
            successMessage.style.display = 'block';
            successMessage.style.opacity = '1';
            successMessage.style.transition = 'opacity 0.3s ease';

            successTimeoutId = setTimeout(() => {
                fadeElement(successMessage).then(() => {
                    successTimeoutId = null;
                });
            }, 4000);
        }

        function clearMessages() {
            if (successTimeoutId) {
                clearTimeout(successTimeoutId);
                successTimeoutId = null;
            }
            if (errorTimeoutId) {
                clearTimeout(errorTimeoutId);
                errorTimeoutId = null;
            }
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        imdbUrlInput.addEventListener('input', () => {
            clearMessages();
        });

        async function fetchComments() {
            try {
                const res = await fetch(`${RENDER_API_URL}/comments`);
                if (!res.ok) throw new Error('Kunne ikke hente kommentarer.');
                const comments = await res.json();
                renderComments(comments);
            } catch (err) {
                console.error('Feil ved henting av kommentarer:', err);
            }
        }

        function renderComments(comments) {
            commentsContainer.innerHTML = '';
            if (!comments || comments.length === 0) {
                commentsContainer.innerHTML = '<p class="text-gray-500 text-center py-6 text-sm sm:text-base">Ingen kommentarer ennå. Bli den første!</p>';
                return;
            }

            comments.forEach(comment => {
                const div = document.createElement('div');
                div.className = 'comment-card bg-gray-800/80 backdrop-blur border border-gray-700/60 p-3.5 sm:p-4 rounded-xl shadow-md';

                const header = document.createElement('div');
                header.className = 'flex items-center justify-between gap-2 mb-2 pb-1.5 border-b border-gray-700/40';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'font-bold text-yellow-400 text-sm truncate';
                nameSpan.textContent = comment.name || 'Anonym';

                const rightContainer = document.createElement('div');
                rightContainer.className = 'flex items-center gap-2.5 shrink-0';

                const dateSpan = document.createElement('span');
                dateSpan.className = 'text-[11px] sm:text-xs text-gray-400';
                const date = new Date(comment.created_at || comment.createdAt);
                dateSpan.textContent = date.toLocaleString('no-NO', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                rightContainer.appendChild(dateSpan);

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'text-red-400 hover:text-red-300 active:scale-90 text-xs font-semibold transition-all px-1.5 py-0.5 rounded';
                deleteBtn.textContent = 'Slett';
                deleteBtn.addEventListener('click', () => deleteComment(comment.id || '', deleteBtn));
                rightContainer.appendChild(deleteBtn);

                header.appendChild(nameSpan);
                header.appendChild(rightContainer);

                const textP = document.createElement('p');
                textP.className = 'text-gray-200 text-sm whitespace-pre-wrap break-words leading-relaxed pt-0.5';
                textP.textContent = comment.text;

                div.appendChild(header);
                div.appendChild(textP);
                commentsContainer.appendChild(div);
            });
        }

        commentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = commentName.value.trim();
            const text = commentInput.value.trim();

            if (!name || !text) return;

            const submitBtn = commentForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');

            try {
                const res = await fetch(`${RENDER_API_URL}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, text })
                });

                if (res.ok) {
                    commentInput.value = '';
                    await fetchComments();
                } else {
                    console.error('Feil ved lagring av kommentar.');
                }
            } catch (err) {
                console.error('Nettverksfeil ved sending av kommentar:', err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50');
            }
        });

        fetchWishes();
        fetchComments();
    </script>

</body>

</html>
